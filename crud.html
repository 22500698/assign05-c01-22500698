<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품관리</title>
    <script>
        let products = [
        {
            id: 1,
            name: "맥북 에어",
            description: "가볍고 빠른 노트북",
            category: "노트북",
            date: "2026-10-01",
            price: 10000,
        },
        {
            id: 2,
            name: "아이패드",
            description: "휴대성이 좋은 태블릿",
            category: "태블릿",
            date: "2026-10-02",
            price: 20000,
        },
        {
            id: 3,
            name: "에어팟",
            description: "무선 블루투스 이어폰",
            category: "이어폰",
            date: "2026-10-03",
            price: 30000,
        },
    ];
    function render() {
        for(let i=0;i<products.length; i++){
            const list = document.querySelector("#list");
            
            const product = products[i].id + " " + products[i].name + " " + products[i].description + " " + products[i].category + " " + products[i].date + " " + products[i].price;
            const productValue = document.createElement("li");
            const editBtn = document.createElement("button");
            const removeBtn = document.createElement("button");

            productValue.textContent = product;
            editBtn.textContent = '수정';
            removeBtn.textContent= '제거';

            list.appendChild(productValue);
            productValue.appendChild(editBtn);
            productValue.appendChild(removeBtn);
            
            editBtn.addEventListener("click", ()=>{eidt()})

            removeBtn.addEventListener("click", () => {
                productValue.remove();
            })
        }
    }
    window.addEventListener("load", (e) => {

        render();
        const name = document.querySelector("#name");
        const description = document.querySelector("#description");
        const category = document.querySelector("#category");
        const date = document.querySelector("#date");
        const price = document.querySelector("#price");
        const list = document.querySelector("#list");
        const addBtn = document.querySelector("#addBtn");
        

        addBtn.addEventListener("click", () => {

            if(!name.checkValidity()){
                name.focus();
                return alert("이름을 입력하세요");
            }

            if(!description.checkValidity()){
                description.focus();
                return alert("설명을 제대로 입력하세요");
            }

            if(!category.checkValidity()){
                category.focus();
                return alert("카테고리를 제대로 입력하세요");
            }
            
            if(!date.checkValidity()){
                date.focus();
                return alert("날짜를 제대로 입력하세요");
            }

            if(!price.checkValidity()){
                price.focus();
                return alert("가격을 제대로 입력하세요");
            }

            products.push({"id": products.length+1, "name": name.value, "description": description.value, "category": category.value, "date": date.value, "price":price.value})
            const productName= products.length + " " + name.value + " " + description.value + " " + category.value + " " +  date.value +" " + price.value;
            const newProduct = document.createElement("li");
            newProduct.textContent = productName;
            list.appendChild(newProduct);
            const editBtn = document.createElement("button");
            const removeBtn = document.createElement("button");

            editBtn.textContent = '수정';
            removeBtn.textContent= '제거';

            newProduct.appendChild(editBtn);
            newProduct.appendChild(removeBtn);
            
            editBtn.addEventListener("click", ()=>{
                const editProduction = newProduct.value.split(" ");
                name.value = editProduction[1];
                description.value = editProduction[2];
                category.value = editProduction[3];
                date.value = editProduction[4];
                price.value = editProduction[5];

                addBtn.addEventListener("click", () => {
                    products[editProduction[0]].name.value = name.value;
                    products[editProduction[0]].description.value = description.value;
                    products[editProduction[0]].category.value = category.value;
                    products[editProduction[0]].date.value = date.value;
                    products[editProduction[0]].price.value = price.value;
                    
                    
                })
            })

            removeBtn.addEventListener("click", () => {
                newProduct.remove();
            })

            name.value = "";
            description.value = "";
            category.value = "";
            date.value = "";
            price.value = "";
        })
    })
    </script>
</head>
<body>
    <form>
        <label>상품명</label>
        <input type="text" id="name" required /><br>
        <label>설명</label>
        <input type="text" id="description" minlength="4" required/><br>
        <label>카테고리</label>
        <input type="text" id="category" required /><br>
        <label>날짜</label>
        <input type="date" id="date" required /><br>
        <label>가격</label>
        <input type="number" id="price" required /><br>
            
        <button type="button"id="addBtn">ADD</button>
    </form>

    <h5>ID   제목          저자       카테고리     가격</h5>
    <ul id="list"></ul>
</body>
</html>
